name: Build DROVA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare build secrets
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY" > .env

      - name: Restore fixed debug keystore
        env:
          DROVA_DEBUG_KEYSTORE_BASE64: ${{ secrets.DROVA_DEBUG_KEYSTORE_BASE64 }}
          DROVA_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DROVA_DEBUG_KEYSTORE_PASSWORD }}
          DROVA_DEBUG_KEY_PASSWORD: ${{ secrets.DROVA_DEBUG_KEY_PASSWORD }}
        run: |
          test -n "$DROVA_DEBUG_KEYSTORE_BASE64"
          test -n "$DROVA_DEBUG_KEYSTORE_PASSWORD"
          test -n "$DROVA_DEBUG_KEY_PASSWORD"
          printf '%s' "$DROVA_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          chmod 600 debug.keystore

      - name: Build APK
        env:
          DROVA_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          DROVA_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DROVA_DEBUG_KEYSTORE_PASSWORD }}
          DROVA_DEBUG_KEY_PASSWORD: ${{ secrets.DROVA_DEBUG_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Check APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DROVA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
